<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sierpinski Carpet - WebGL</title>
<style>
body { font-family: sans-serif; display: flex; flex-wrap: wrap; gap: 24px; padding: 20px; }
canvas { border: 1px solid #999; max-width: 100%; }
.panel { display: flex; flex-direction: column; gap: 14px; min-width: 240px; }
label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
</style>
</head>
<body>
<canvas id="gl-canvas" width="600" height="600"></canvas>
<div class="panel">
  <h3>Sierpinski Carpet</h3>
  <label>분할 횟수
    <input type="range" id="depth" min="0" max="6" value="3">
    <span id="depthValue">3</span>
  </label>
  <label>색상 모드
    <select id="mode">
      <option value="0">단색</option>
      <option value="1">그라데이션</option>
    </select>
  </label>
  <label>색상 1 <input type="color" id="color1" value="#1e3a8a"></label>
  <label>색상 2 <input type="color" id="color2" value="#f97316"></label>
  <label>배경색 <input type="color" id="bgColor" value="#ffffff"></label>
  <p id="info"></p>
</div>

<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec2 aPosition;
varying vec2 vPosition;
void main() {
  vPosition = aPosition;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;
varying vec2 vPosition;
uniform vec3 uColor1;
uniform vec3 uColor2;
uniform int uMode;
void main() {
  vec3 color = uColor1;
  if (uMode == 1) {
    float t = clamp((vPosition.x + vPosition.y + 1.8) / 3.6, 0.0, 1.0);
    color = mix(uColor1, uColor2, t);
  }
  gl_FragColor = vec4(color, 1.0);
}
</script>

<script>
let gl, program, vBuffer;
let positions = [];
let vertexCount = 0;
let uColor1Loc, uColor2Loc, uModeLoc;

window.onload = function () {
  const canvas = document.getElementById("gl-canvas");
  gl = canvas.getContext("webgl");
  if (!gl) {
    alert("WebGL을 지원하지 않는 브라우저입니다.");
    return;
  }

  gl.viewport(0, 0, canvas.width, canvas.height);

  program = createProgram("vertex-shader", "fragment-shader");
  gl.useProgram(program);

  vBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vBuffer);

  const aPosition = gl.getAttribLocation(program, "aPosition");
  gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(aPosition);

  uColor1Loc = gl.getUniformLocation(program, "uColor1");
  uColor2Loc = gl.getUniformLocation(program, "uColor2");
  uModeLoc = gl.getUniformLocation(program, "uMode");

  document.getElementById("depth").addEventListener("input", updateGeometry);
  document.getElementById("mode").addEventListener("change", render);
  document.getElementById("color1").addEventListener("input", render);
  document.getElementById("color2").addEventListener("input", render);
  document.getElementById("bgColor").addEventListener("input", render);

  updateGeometry();
};

function compileShader(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

function createProgram(vsId, fsId) {
  const vs = compileShader(gl.VERTEX_SHADER, document.getElementById(vsId).text);
  const fs = compileShader(gl.FRAGMENT_SHADER, document.getElementById(fsId).text);
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(p));
  }
  return p;
}

function square(x, y, size) {
  const x2 = x + size;
  const y2 = y + size;
  positions.push(
    x, y,  x2, y,  x2, y2,
    x, y,  x2, y2, x, y2
  );
}

function divideSquare(x, y, size, depth) {
  if (depth === 0) {
    square(x, y, size);
    return;
  }
  const s = size / 3;
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      if (i === 1 && j === 1) continue;
      divideSquare(x + i * s, y + j * s, s, depth - 1);
    }
  }
}

function updateGeometry() {
  const depth = parseInt(document.getElementById("depth").value);
  document.getElementById("depthValue").textContent = depth;

  positions = [];
  divideSquare(-0.9, -0.9, 1.8, depth);
  vertexCount = positions.length / 2;

  gl.bindBuffer(gl.ARRAY_BUFFER, vBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

  document.getElementById("info").textContent =
    "사각형 " + (vertexCount / 6) + "개 / 정점 " + vertexCount + "개";

  render();
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

function render() {
  const bg = hexToRgb(document.getElementById("bgColor").value);
  gl.clearColor(bg[0], bg[1], bg[2], 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform3fv(uColor1Loc, hexToRgb(document.getElementById("color1").value));
  gl.uniform3fv(uColor2Loc, hexToRgb(document.getElementById("color2").value));
  gl.uniform1i(uModeLoc, parseInt(document.getElementById("mode").value));

  gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
}
</script>
</body>
</html>
